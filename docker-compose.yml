services:
  postgres:
    image: postgres:16-alpine
    container_name: shop-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shop-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shop-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Required - the app fails to boot without it (ConfigService.getOrThrow).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, copy .env.example to .env}
      # Crypto payment verification (Sepolia testnet).
      SHOP_WALLET_ADDRESS: ${SHOP_WALLET_ADDRESS:-}
      RPC_URL: ${RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}
      CHAIN_ID: ${CHAIN_ID:-11155111}
      # Owner auth - a JWT whose email/wallet matches these gets the admin role.
      SHOP_OWNER_EMAIL: ${SHOP_OWNER_EMAIL:-}
      WALLET_ADDRESS: ${WALLET_ADDRESS:-}
      # Database tier: unset/standard -> PostgreSQL, light -> Redis.
      SHOP_DB_TIER: ${SHOP_DB_TIER:-standard}
      # Observability.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${BACKEND_PORT:-8080}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shop-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shop-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BACKEND_INTERNAL_URL: http://backend:3000
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - shop-net

volumes:
  postgres-data:

networks:
  shop-net:
    driver: bridge
